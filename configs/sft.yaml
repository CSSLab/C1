### model
model_name_or_path: Qwen/Qwen3-4B-Instruct-2507
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: ../LLaMA-Factory/examples/deepspeed/ds_z2_config.json

### dataset
dataset: sft_data_cot
dataset_dir: data
template: qwen3_nothink
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
# full-param checkpoints are ~8GB each; point output_dir at a large disk if needed
output_dir: saves/sft
logging_steps: 1
save_strategy: epoch
save_only_model: true
plot_loss: true
overwrite_output_dir: true
report_to: wandb
run_name: sft

### train
# full FT, lr 1e-5, cosine + 10% warmup, effective batch 256
per_device_train_batch_size: 32
gradient_accumulation_steps: 1
learning_rate: 1e-5
num_train_epochs: 10.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
